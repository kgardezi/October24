<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Idea Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231f6feb'/%3E%3Cpath d='M14 34h6v-6h-6zM28 34h6v-6h-6zM21 20h6v-6h-6zM17 28v-4h14v4M24 20v4' stroke='white' stroke-width='2.5' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f7f7f8; --grid:#c9ccd3; --panel:#ffffff; --border:rgba(0,0,0,.07);
  --shadow:0 0 0 1px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.08);
  --text:#1d1d1f; --muted:#6b7280; --hover:#f0f1f3; --accent:#1f6feb; --accent-soft:#e7f0fe; --danger:#e03131;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101113; --grid:#34373e; --panel:#1c1d21; --border:rgba(255,255,255,.08);
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.5);
  --text:#e8e8ea; --muted:#9ca3af; --hover:#2a2c31; --accent:#4d8ff5; --accent-soft:#1d2b42;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
#canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
.panel{position:fixed;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);z-index:10}
.ibtn{width:36px;height:36px;border:0;background:transparent;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;color:var(--text);position:relative;flex:none}
.ibtn:hover{background:var(--hover)}
.ibtn.active{background:var(--accent);color:#fff}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn .kbd{position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.55}
.ibtn.active .kbd{opacity:.8}
/* top-left */
#topleft{top:10px;left:10px;display:flex;align-items:center;gap:2px;padding:4px}
#boardName{border:0;background:transparent;font:600 14px var(--font);color:var(--text);padding:6px 8px;border-radius:8px;width:160px;outline:none}
.pagebtn{display:flex;align-items:center;gap:4px;border:0;background:transparent;height:32px;padding:0 6px 0 8px;border-radius:8px;cursor:pointer;font:500 13px var(--font);color:var(--muted);max-width:230px}
.pagebtn:hover,.pagebtn.open{background:var(--hover);color:var(--text)}
.pagebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pagebtn svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pagesPanel{top:56px;left:10px;width:270px;padding:6px;display:none;z-index:30}
#pagesPanel.open{display:block}
#boardsPanel{top:56px;left:10px;width:310px;padding:6px;display:none;z-index:30;max-height:calc(100vh - 80px);overflow:auto}
#boardsPanel.open{display:block}
.bp-item{height:auto;min-height:44px;padding:5px 4px 5px 10px}
.bp-text{flex:1;min-width:0}
.bp-text .pp-name{display:block}
.bp-meta{font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
.bp-foot{font-size:11px;color:var(--muted);padding:8px 8px 4px;border-top:1px solid var(--border);margin-top:4px;line-height:1.4}
.pp-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 4px 8px;font-weight:600;font-size:12px;color:var(--muted)}
.pp-head .ibtn{width:30px;height:30px}
.pp-item{display:flex;align-items:center;gap:4px;border-radius:7px;padding:0 4px 0 10px;height:34px;cursor:pointer}
.pp-item:hover{background:var(--hover)}
.pp-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pp-num{font-size:11px;color:var(--muted);width:14px;font-variant-numeric:tabular-nums}
.pp-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-acts{display:none;gap:1px}
.pp-item:hover .pp-acts,.pp-item.active .pp-acts{display:flex}
.pp-acts button{border:0;background:none;width:24px;height:24px;border-radius:5px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.pp-acts button:hover{background:var(--panel);color:var(--text)}
.pp-acts button.danger:hover{color:var(--danger)}
.pp-acts svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pp-input{flex:1;min-width:0;border:1px solid var(--accent);border-radius:5px;padding:4px 6px;font:13px var(--font);background:var(--panel);color:var(--text);outline:none}
#boardName:hover,#boardName:focus{background:var(--hover)}
/* menu */
#menu{top:56px;left:10px;padding:6px;min-width:240px;display:none;z-index:40;max-height:calc(100vh - 70px);overflow:auto}
#menu.open{display:block}
#menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer}
#menu button:hover{background:var(--hover)}
#menu button span:last-child{color:var(--muted);font-size:12px}
#menu hr{border:0;border-top:1px solid var(--border);margin:5px 4px}
/* toolbar */
#toolbar{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:5px;align-items:center;max-width:calc(100vw - 24px);overflow-x:auto}
#toolbar .sep{width:1px;height:24px;background:var(--border);margin:0 4px;flex:none}
/* bottom-left */
#bottomleft{bottom:12px;left:10px;display:flex;align-items:center;gap:2px;padding:5px}
#zoomPct{min-width:52px;height:36px;border:0;background:none;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
#zoomPct:hover{background:var(--hover)}
/* library */
#library{top:62px;left:10px;width:236px;max-height:calc(100vh - 140px);overflow:auto;padding:10px;display:none}
#library.open{display:block}
#library h4{margin:10px 4px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
#library h4:first-child{margin-top:2px}
.libgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.libitem{border:0;background:none;border-radius:8px;padding:8px 2px 6px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--text)}
.libitem:hover{background:var(--hover)}
.libitem.active{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.libitem svg{width:34px;height:34px}
.linkrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer;font-size:12px}
.linkrow:hover{background:var(--hover)}
.linkrow.active{background:var(--accent-soft)}
.linkrow svg{width:46px;height:12px;flex:none}
/* style panel */
#stylePanel{top:10px;right:10px;width:228px;padding:10px;max-height:calc(100vh - 20px);overflow:auto}
#stylePanel:empty{display:none}
.sp-sec{padding:6px 0;border-top:1px solid var(--border)}
.sp-sec:first-child{border-top:0;padding-top:0}
.sp-lbl{font-size:11px;color:var(--muted);margin:2px 2px 6px;font-weight:600}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.sw{height:30px;border:0;background:none;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.sw:hover{background:var(--hover)}
.sw i{width:17px;height:17px;border-radius:50%;display:block}
.sw.active{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg{display:flex;gap:2px;background:var(--hover);border-radius:8px;padding:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;height:28px;cursor:pointer;font-size:12px;display:grid;place-items:center;padding:0 4px}
.seg button.active{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.15);color:var(--accent);font-weight:600}
.seg svg{width:22px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.sp-row{display:flex;gap:6px;margin-top:6px}
.field{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;padding:6px 8px;font:12px var(--font);outline:none;margin-bottom:6px;resize:vertical}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:52px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.acts button{border:0;background:none;height:30px;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.acts button:hover{background:var(--hover)}
.acts button.danger:hover{background:rgba(224,49,49,.12);color:var(--danger)}
.acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.presets button{border:1px solid var(--border);background:none;border-radius:7px;padding:5px 6px;font-size:11px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:6px}
.presets button:hover{background:var(--hover)}
.presets button b{width:16px;height:0;border-top:3px solid;display:inline-block;flex:none}
/* editor */
.editor{position:absolute;z-index:20;border:0;outline:none;background:transparent;resize:none;overflow:hidden;padding:0;margin:0;font-family:var(--font);line-height:1.28;white-space:pre-wrap;word-wrap:break-word;caret-color:var(--accent)}
.editor.pill{background:var(--panel);border-radius:4px;box-shadow:0 0 0 1.5px var(--accent)}
/* toast / help */
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:500;transition:transform .2s;z-index:50;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#who{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:grid;place-items:center;padding:16px}
#who .card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:400px;padding:22px 24px}
#who h2{margin:0 0 6px;font-size:18px}
#who p{margin:0 0 14px;color:var(--muted);line-height:1.45}
#who .field{font-size:15px;padding:9px 11px;font-family:var(--font)}
#who button{width:100%;margin-top:6px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 14px var(--font);padding:10px;cursor:pointer}
#people{display:none;align-items:center;gap:4px;padding:0 4px 0 2px}
#people.on{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px var(--font);border:2px solid var(--panel);margin-left:-6px;cursor:default;flex:none}
.av:first-child{margin-left:0}
.av.me{cursor:pointer;outline:2px solid transparent}
.av.me:hover{outline-color:var(--accent)}
.netdot{width:8px;height:8px;border-radius:50%;background:#adb5bd;margin:0 4px 0 2px;flex:none}
.netdot.live{background:#37b24d}.netdot.connecting{background:#fcc419}.netdot.offline{background:#e03131}
.bp-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 8px 4px}
.bp-new{display:flex;gap:6px;padding:0 4px 6px}
.bp-new button{flex:1;border:1px solid var(--border);background:none;border-radius:7px;padding:6px;cursor:pointer;font:12px var(--font);color:var(--text)}
.bp-new button:hover{background:var(--hover)}
.bp-tag{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--hover);color:var(--muted);margin-left:6px;font-weight:600}
#help{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;place-items:center;padding:16px}
#help.open{display:grid}
#help .card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:20px 24px}
#help h2{margin:0 0 4px;font-size:18px}
#help p{color:var(--muted);margin:0 0 14px}
#help .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
#help .k{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)}
#help kbd{font:11px ui-monospace,Menlo,monospace;background:var(--hover);border-radius:4px;padding:2px 6px}
#bottomleft.stacked{bottom:64px}
body.stacked #library{max-height:calc(100vh - 210px)}
@media (max-width:1180px){#toolbar [data-tool^="device:"],#toolbar .sep.devsep{display:none}}
@media (max-width:700px){#help .cols{grid-template-columns:1fr}#stylePanel{width:200px}#boardName{width:120px}}
</style>
</head>
<body>
<svg id="canvas" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20"><circle id="dot" cx="1" cy="1" r="1" fill="var(--grid)"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".18"/></filter>
  </defs>
  <rect id="gridbg" x="0" y="0" width="100%" height="100%" fill="url(#dots)"/>
  <g id="world"></g>
  <g id="ui"></g>
  <g id="laser" fill="hsl(0, 100%, 50%)" fill-opacity=".7" pointer-events="none"></g>
  <g id="presence" pointer-events="none"></g>
</svg>
<div id="editors"></div>

<div id="topleft" class="panel">
  <button class="ibtn" id="menuBtn" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="ibtn" id="boardsBtn" title="Boards — switch or create boards"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="7.5" height="7" rx="1.5"/><rect x="13" y="4" width="7.5" height="7" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7" rx="1.5"/><rect x="13" y="13" width="7.5" height="7" rx="1.5"/></svg></button>
  <input id="boardName" spellcheck="false" value="Untitled board" aria-label="Board name">
  <button class="pagebtn" id="pageBtn" title="Pages (PageUp / PageDown to switch)"><span id="pageName">Page 1</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <div id="people"></div>
  <button class="ibtn" id="libBtn" title="Network library (Shift+L)"><svg viewBox="0 0 24 24"><path d="M9 3h6v5H9zM3 16h6v5H3zM15 16h6v5h-6zM12 8v4M6 16v-4h12v4"/></svg></button>
</div>
<div id="pagesPanel" class="panel"></div>
<div id="boardsPanel" class="panel"></div>
<div id="menu" class="panel">
  <button data-menu="boards"><span>Boards…</span><span></span></button>
  <button data-menu="new"><span>New board</span><span></span></button>
  <button data-menu="open"><span>Open file as new board…</span><span>Ctrl O</span></button>
  <button data-menu="save"><span>Save to file</span><span>Ctrl S</span></button>
  <hr>
  <button data-menu="image"><span>Insert picture…</span><span>I · or paste</span></button>
  <button data-menu="unlock"><span>Unlock everything on this page</span><span></span></button>
  <hr>
  <button data-menu="png"><span>Export PNG</span><span>Ctrl Shift E</span></button>
  <button data-menu="svg"><span>Export SVG</span><span></span></button>
  <hr>
  <button data-menu="sample"><span>Insert sample topology</span><span></span></button>
  <hr>
  <button data-menu="grid"><span>Show grid</span><span id="mGrid"></span></button>
  <button data-menu="snap"><span>Snap to grid</span><span id="mSnap"></span></button>
  <button data-menu="guides"><span>Alignment guides</span><span id="mGuides"></span></button>
  <button data-menu="theme"><span>Dark mode</span><span id="mTheme"></span></button>
  <hr>
  <button data-menu="help"><span>Keyboard shortcuts</span><span>?</span></button>
</div>
<div id="library" class="panel"></div>
<div id="stylePanel" class="panel"></div>
<div id="toolbar" class="panel"></div>
<div id="bottomleft" class="panel">
  <button class="ibtn" data-act="undo" title="Undo (Ctrl Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="ibtn" data-act="redo" title="Redo (Ctrl Shift Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <span style="width:1px;height:22px;background:var(--border);margin:0 3px"></span>
  <button class="ibtn" data-act="zoomout" title="Zoom out (-)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="zoomPct" data-act="zoomreset" title="Reset zoom (Shift 0)">100%</button>
  <button class="ibtn" data-act="zoomin" title="Zoom in (+)"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  <button class="ibtn" data-act="zoomfit" title="Zoom to fit (Shift 1)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="toast"></div>
<div id="help"><div class="card">
  <h2>Idea Board — shortcuts</h2>
  <p>Draw network diagrams fast. Links snap to devices and follow them when moved.</p>
  <div class="cols" id="helpCols"></div>
</div></div>
<input type="file" id="fileInput" accept=".json,.ideaboard,application/json" hidden>
<input type="file" id="imageInput" accept="image/*" multiple hidden>

<script>
"use strict";
/* ============================================================

const $ = s => document.querySelector(s);
const FONT_SYS = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
/* Hand-drawn canvas font, like tldraw's: "Shantell Sans Informal" by Stephen Nixon, Anya Danilova and
   Shantell Martin (Arrow Type), Copyright 2022 The Shantell Sans Project Authors, SIL Open Font License 1.1
   (see FONT-LICENSE.txt). Embedded as a Latin-only subset so the app stays offline and small. */

  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.deltaMode ? .05 : .01)));
  else { const k = e.deltaMode ? 20 : 1; cam.x -= (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * k; cam.y -= (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * k; render(); save(); }
}, {passive: false});

  const p = toWorld(e.clientX, e.clientY);

  if (s && s.type !== 'draw'){ sel = new Set([s.id]); startEdit(s); return; }

/* ---------- inline text editing ---------- */
function startEdit(s, field = 'text', defer = false){
  if (editing) finishEdit();
  const single = s.type === 'device' || s.type === 'zone';
  const ta = document.createElement('textarea');
  ta.className = 'editor' + (s.type === 'connector' ? ' pill' : '');
  ta.value = s[field] || ''; ta.spellcheck = false; ta.rows = 1;
  $('#editors').appendChild(ta);
  editing = {id: s.id, field, el: ta, single};
  ta.addEventListener('input', () => { const sh = byId(editing.id); sh[field] = ta.value; if (sh.type === 'text') layoutText(sh); render(); });
  ta.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Escape' || (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) || (ev.key === 'Enter' && single && !ev.shiftKey)){ ev.preventDefault(); finishEdit(); }
  });
  ta.addEventListener('blur', () => setTimeout(() => { if (editing && editing.el === ta) finishEdit(); }, 0));
  render(); positionEditor();
  if (!defer){ ta.focus(); ta.select(); }
  else setTimeout(() => { ta.focus(); ta.select(); }, 0);
}
function positionEditor(){
  if (!editing) return;
  const s = byId(editing.id); if (!s){ finishEdit(); return; }
  const ta = editing.el, z = cam.z;
  let fs = FONTS[s.fontSize || 'm'], cx, cy, w, align = 'center', top = false, weight = 400, color = col(s.color);
  if (s.type === 'text'){ cx = s.x; cy = s.y; w = Math.max(s.w + fs, 40); align = 'left'; top = true; }
  else if (s.type === 'device' && s.view === 'rack' && s.nameInside){ fs = rackNameFs(s.h); weight = 700; cx = s.x + rackBand(s.w, s.h) + rackPad(s.h) * .7; cy = s.y + s.h / 2; w = Math.max(60, s.w - rackBand(s.w, s.h) - rackPad(s.h) * 1.7); align = 'left'; color = TEXT(); }
  else if (s.type === 'device'){ fs = 14; weight = 600; cx = s.x + s.w / 2; cy = s.y + s.h + 16; w = Math.max(180, s.w + 60); color = TEXT(); }
  else if (s.type === 'zone'){ fs = Math.min(fs, 20); weight = 600; cx = s.x + 14; cy = s.y + 20; w = s.w - 28; align = 'left'; }
  else if (s.type === 'connector'){ const g = connGeom(s); fs = Math.round(fs * .72); weight = 500; cx = g.mid.x; cy = g.mid.y; w = 220; }
  else if (s.type === 'note'){ cx = s.x + s.w / 2; cy = s.y + s.h / 2; w = s.w - 28; color = TEXT(); }
  else { cx = s.x + s.w / 2; cy = s.y + s.h / 2; w = s.type === 'rect' ? s.w - 24 : s.type === 'diamond' ? s.w * .5 : s.w * .62; weight = s.type === 'cloud' ? 600 : 400; }
  ta.style.fontFamily = famOf(s); ta.style.fontSize = fs * z + 'px'; ta.style.fontWeight = weight; ta.style.color = color; ta.style.textAlign = align;
  ta.style.width = Math.max(w, 30) * z + 'px'; ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
  const W = Math.max(w, 30) * z, H = ta.scrollHeight;
  const sx = cx * z + cam.x, sy = cy * z + cam.y;
  ta.style.left = (align === 'left' ? sx : sx - W / 2) + 'px';
  ta.style.top = (top ? sy : sy - (align === 'left' && s.type === 'zone' ? fs * z * .64 : H / 2)) + 'px';
}
function finishEdit(){
  if (!editing) return;
  const {id, el} = editing; editing = null; el.remove();
  const s = byId(id);
  if (s && s.type === 'text' && !String(s.text).trim()){ board.shapes = board.shapes.filter(x => x.id !== id); sel.delete(id); }
  panelKey = ''; commit(); render();
}

/* ---------- laser pointer ----------
   Mirrors tldraw's LaserTool + ScribbleManager: strokes join one session; the session stays on screen
   until 1200 ms after the last activity (holding the pointer down keeps it alive), then all of its
   strokes fade together over 500 ms, oldest points first, with ease-in. Red hsl(0,100%,50%) at 70%
   opacity, 4 px on screen at any zoom, no taper, streamline 0.32. Never saved, undone or exported. */
const LASER = {delayMs: 1200, fadeMs: 500, size: 4, streamline: .32};
let lasers = [], laserDraw = null, laserRaf = 0, laserLast = 0;
function laserStart(p){
  netLaser('start', p);
  let s = lasers.find(x => x.state === 'active' && !x.uid);
  if (!s){ s = {items: [], state: 'active', lastActive: 0, fadeElapsed: 0, total: 0}; lasers.push(s); }
  const item = {pts: [p], done: false};
  s.items.push(item); s.lastActive = performance.now(); laserDraw = {s, item};
  laserLoop(); drawLaser();
}
function laserMove(p){
  if (!laserDraw) return;
  const {s, item} = laserDraw, l = item.pts[item.pts.length - 1];
  if (Math.hypot(p.x - l.x, p.y - l.y) >= 1){ item.pts.push(p); netLaser('move', p); }
  s.lastActive = performance.now();
}
function laserEnd(){ if (laserDraw){ netLaser('end'); laserDraw.item.done = true; laserDraw.s.lastActive = performance.now(); laserDraw = null; } }
function clearLasers(){ lasers = []; laserDraw = null; remoteLaser = {}; if ($('#laser')) drawLaser(); }
function laserLoop(){ if (!laserRaf){ laserLast = performance.now(); laserRaf = requestAnimationFrame(laserTick); } }
function laserTick(now){
  const dt = Math.min(100, Math.max(0, now - laserLast)); laserLast = now; laserRaf = 0;
  for (const s of lasers){
    if (s.state === 'active'){
      if ((laserDraw && laserDraw.s === s) || laserHeldRemote(s)) s.lastActive = now;   // pointer held: extend session
      else if (now - s.lastActive >= LASER.delayMs){
        s.state = 'stopping'; s.fadeElapsed = 0; s.items.forEach(i => i.done = true);
        s.total = s.items.reduce((a, i) => a + i.pts.length, 0);
      }
    } else {
      s.fadeElapsed += dt;
      const remaining = s.items.reduce((a, i) => a + i.pts.length, 0);
      if (s.fadeElapsed >= LASER.fadeMs) s.items.forEach(i => { i.pts.length = 0; });
      else if (remaining){
        const pr = s.fadeElapsed / LASER.fadeMs, eased = pr * pr;             // ease-in
        let n = Math.max(1, Math.floor(eased * s.total) - (s.total - remaining)), k = 0;
        while (n > 0 && k < s.items.length){ const it = s.items[k]; if (it.pts.length){ it.pts.shift(); n--; } else k++; }
      }
    }
  }
  lasers = lasers.filter(s => s.items.some(i => i.pts.length) || (laserDraw && laserDraw.s === s) || laserHeldRemote(s));
  drawLaser();
  if (lasers.length) laserRaf = requestAnimationFrame(laserTick);
}
function drawLaser(){
  const g = $('#laser');
  g.setAttribute('transform', `translate(${r2(cam.x)} ${r2(cam.y)}) scale(${cam.z})`);
  const size = LASER.size / cam.z;
  let out = '';
  for (const s of lasers) for (const it of s.items){
    if (!it.pts.length) continue;
    out += `<path d="${freehand(it.pts, {size, thinning: 0, streamline: LASER.streamline, last: it.done || s.state !== 'active'})}"/>`;
  }
  g.innerHTML = out;
}

/* ---------- operations ---------- */
function deleteSel(){
  if (!sel.size) return;
  const gone = new Set([...sel].filter(id => !(byId(id) || {}).locked));
  board.shapes = board.shapes.filter(s => !gone.has(s.id) && !(s.type === 'connector' && (gone.has(s.start.id) || gone.has(s.end.id))));
  sel.clear(); commit(); render();
}
function cloneShapes(ids){
  const set = new Set(ids);
  const shapes = board.shapes.filter(s => set.has(s.id));
  for (const c of board.shapes) if (c.type === 'connector' && !set.has(c.id) && set.has(c.start.id) && set.has(c.end.id)) shapes.push(c);
  return JSON.parse(JSON.stringify(shapes));
}
function pasteShapes(shapes, offset = 24, at = null){
  const map = {};
  shapes.forEach(s => map[s.id] = uid());
  let dx = offset, dy = offset;
  if (at){ const b = union(shapes.filter(s => s.type !== 'connector').map(hitBounds)); if (b){ dx = at.x - (b.x + b.w / 2); dy = at.y - (b.y + b.h / 2); } }
  const out = [];
  for (const s0 of shapes){
    const s = JSON.parse(JSON.stringify(s0)); s.id = map[s0.id];
    if (s.type === 'connector'){
      for (const k of ['start', 'end']){
        if (s[k].id && map[s[k].id]) s[k] = {id: map[s[k].id]};
        else if (s[k].id){ const g = connGeom(s0); const pt = k === 'start' ? g.a : g.b; s[k] = {x: pt.x + dx, y: pt.y + dy}; }
        else s[k] = {x: s[k].x + dx, y: s[k].y + dy};
      }
    } else { s.x += dx; s.y += dy; }
    addShape(s); out.push(s.id);
  }
  return out;
}
function duplicate(ids, offset = 24){ return pasteShapes(cloneShapes(ids), offset); }
function copySel(cut){
  if (!sel.size) return;
  clip = cloneShapes([...sel]);
  clipAssets = {}; for (const s of clip) if (s.type === 'image' && assets[s.asset]) clipAssets[s.asset] = assets[s.asset];
  const txt = JSON.stringify({app: 'idea-board', shapes: clip, assets: clipAssets});
  try { navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {}); } catch (_) {}
  if (cut) deleteSel();
}
let clipAssets = {};
function paste(data, dataAssets){
  const shapes = data || clip; if (!shapes || !shapes.length) return;
  for (const [k, v] of Object.entries(dataAssets || clipAssets || {})) if (!assets[k]) assets[k] = v;
  const c = toWorld(innerWidth / 2, innerHeight / 2);
  sel = new Set(pasteShapes(shapes, 0, lastMouse ? toWorld(lastMouse.x, lastMouse.y) : c)); commit(); render();
}
let lastMouse = null;
window.addEventListener('pointermove', e => { lastMouse = {x: e.clientX, y: e.clientY}; netCursor(e); });
function reorder(dir){
  const ids = new Set(sel); if (!ids.size) return;
  const moving = board.shapes.filter(s => ids.has(s.id)), rest = board.shapes.filter(s => !ids.has(s.id));
  board.shapes = dir === 'front' ? [...rest, ...moving] : [...moving, ...rest];
  commit(); render();
}
function align(how){
  const shapes = [...sel].map(byId).filter(s => s && s.type !== 'connector'); if (shapes.length < 2) return;
  const B = union(shapes.map(bounds));
  if (how.startsWith('dist')){
    const hz = how === 'dist-h', key = hz ? 'x' : 'y', dim = hz ? 'w' : 'h';
    const sorted = shapes.slice().sort((a, b) => bounds(a)[key] - bounds(b)[key]);
    const total = sorted.reduce((a, s) => a + bounds(s)[dim], 0), gap = (B[dim] - total) / (sorted.length - 1);
    let pos = B[key];
    for (const s of sorted){ const b = bounds(s); s[key] += pos - b[key]; pos += b[dim] + gap; }
  } else for (const s of shapes){
    const b = bounds(s);
    if (how === 'left') s.x += B.x - b.x; if (how === 'right') s.x += B.x + B.w - b.x - b.w; if (how === 'ch') s.x += B.x + B.w / 2 - b.x - b.w / 2;
    if (how === 'top') s.y += B.y - b.y; if (how === 'bottom') s.y += B.y + B.h - b.y - b.h; if (how === 'cv') s.y += B.y + B.h / 2 - b.y - b.h / 2;
  }
  commit(); render();
}
function nudge(dx, dy){ for (const id of sel){ const s = byId(id); if (!s) continue; if (s.type === 'connector'){ if (!s.start.id){ s.start.x += dx; s.start.y += dy; } if (!s.end.id){ s.end.x += dx; s.end.y += dy; } } else { s.x += dx; s.y += dy; } } commit(); render(); }

const AI = p => `<svg viewBox="0 0 24 24">${p}</svg>`;

  if (has('rect', 'ellipse', 'diamond', 'cloud', 'zone', 'note', 'text', 'connector'))

    if (shapes.filter(s => s.type !== 'connector').length > 1)
      h += `<div class="acts" style="margin-top:4px">` +
        `<button data-act="al-left" title="Align left">${AI('<path d="M4 3v18M8 7h10M8 12h6M8 17h12"/>')}</button>` +
        `<button data-act="al-ch" title="Align centre">${AI('<path d="M12 3v18M6 7h12M8 12h8M5 17h14"/>')}</button>` +
        `<button data-act="al-right" title="Align right">${AI('<path d="M20 3v18M6 7h10M10 12h6M4 17h12"/>')}</button>` +
        `<button data-act="dist-h" title="Distribute horizontally">${AI('<path d="M4 4v16M20 4v16"/><rect x="9" y="8" width="6" height="8" rx="1"/>')}</button>` +
        `<button data-act="al-top" title="Align top">${AI('<path d="M3 4h18M7 8v10M12 8v6M17 8v12"/>')}</button>` +
        `<button data-act="al-cv" title="Align middle">${AI('<path d="M3 12h18M7 6v12M12 8v8M17 5v14"/>')}</button>` +
        `<button data-act="al-bottom" title="Align bottom">${AI('<path d="M3 20h18M7 6v10M12 10v6M17 4v12"/>')}</button>` +
        `<button data-act="dist-v" title="Distribute vertically">${AI('<path d="M4 4h16M4 20h16"/><rect x="8" y="9" width="8" height="6" rx="1"/>')}</button></div>`;
    h += `</div>`;
  }

}
function setDeviceView(v){
  for (const id of sel){
    const s = byId(id); if (!s || s.type !== 'device' || (s.view || 'icon') === v) continue;
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2, [w, h] = v === 'rack' ? RACK_SIZE : [64, 64];
    s.view = v; s.w = w; s.h = h; s.x = r2(cx - w / 2); s.y = r2(cy - h / 2);
  }
  commit(); panelKey = ''; render();
}
function applyStyle(key, v){
  style[key] = v; savePrefs();
  for (const id of sel){
    const s = byId(id); if (!s) continue;
    if (key === 'arrows' || key === 'route'){ if (s.type === 'connector'){ s[key] = v; if (key === 'route') s.bend = 0; } continue; }
    if (key === 'fontSize' && s.type === 'device') continue;
    if (key === 'font' && (s.type === 'image' || s.type === 'draw')) continue;
    if ((key === 'dash' || key === 'size') && (s.type === 'device' || s.type === 'note' || s.type === 'text')) continue;
    s[key] = v;
    if (s.type === 'text') layoutText(s);
  }
  commit(); panelKey = ''; render();
}
$('#stylePanel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.set === 'view') return setDeviceView(b.dataset.v);
  if (b.dataset.set === 'nameInside'){
    for (const id of sel){ const d = byId(id); if (d && d.type === 'device' && d.view === 'rack'){ if (b.dataset.v === '1') d.nameInside = true; else delete d.nameInside; } }
    commit(); panelKey = ''; render(); return;
  }
  if (b.dataset.set) return applyStyle(b.dataset.set, b.dataset.v);
  if (b.dataset.preset){
    const l = LINKS[b.dataset.preset];
    for (const id of sel){ const s = byId(id); if (s && s.type === 'connector') Object.assign(s, {color: l.color, dash: l.dash, size: l.size}); }
    commit(); panelKey = ''; render(); return;
  }
  const a = b.dataset.act;
  if (a === 'lock') return toggleLock();
  if (a === 'front' || a === 'back') reorder(a);
  else if (a === 'dup'){ sel = new Set(duplicate([...sel])); commit(); render(); }
  else if (a === 'del') deleteSel();
  else if (a && a.startsWith('al-')) align(a.slice(3));
  else if (a && a.startsWith('dist-')) align(a);
});
$('#stylePanel').addEventListener('input', e => {
  const f = e.target.closest('[data-prop]'); if (!f || sel.size !== 1) return;
  const s = byId([...sel][0]); if (!s) return;
  const k = f.dataset.prop;
  if (k === 'kind'){ s.kind = f.value; s.color = DEVICES[f.value].color; if (DEVICES[f.value].shape === 'circle' && s.view !== 'rack') s.h = s.w; panelKey = ''; }
  else s[k] = f.value;
  render();
});
$('#stylePanel').addEventListener('change', () => commit());

/* ---------- files & export ---------- */
function download(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const clean = t => String(t || '').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-');
const fileBase = () => clean(board.name) || 'idea-board';
const exportBase = () => fileBase() + (pages.length > 1 && pages[curPage] ? '-' + clean(pageLabel(curPage)) : '');
function saveFile(){
  syncPage();
  const data = {app: 'idea-board', version: 2, name: board.name, savedAt: new Date().toISOString(), current: curPage, pages: pages.map(p => ({id: p.id, name: p.name, cam: p.cam, shapes: p.shapes})), assets: usedAssets()};
  download(fileBase() + '.ideaboard.json', new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}));
  toast('Saved ' + fileBase() + '.ideaboard.json');
}
function openFile(f){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      let pg;
      if (d && Array.isArray(d.pages) && d.pages.length) pg = d.pages.map((p, i) => ({id: p.id || uid(), name: normPageName(p.name), cam: p.cam || null, shapes: Array.isArray(p.shapes) ? p.shapes : []}));
      else if (d && Array.isArray(d.shapes)) pg = [{id: uid(), name: '', cam: null, shapes: d.shapes}];
      else throw new Error('bad');
      if (SERVER){ srvNew(false, String(d.name || f.name.replace(/\.(ideaboard\.)?json$/, '')).slice(0, 80), {name: d.name, pages: pg.map(p => ({id: p.id, name: p.name, shapes: p.shapes})), assets: d.assets || {}}); return; }
      saveNow(); assets = d.assets && typeof d.assets === 'object' ? d.assets : {};
      const nm = uniqueBoardName(String(d.name || f.name.replace(/\.(ideaboard\.)?json$/, '')).slice(0, 80) || 'Imported board');
      enterBoard(uid(), nm, pg, d.current);
      toast(`Opened ${f.name} as board "${nm}" (${pages.length} page${pages.length > 1 ? 's' : ''})`);
    } catch (e) { toast('That file is not an Idea Board file'); }
  };
  r.readAsText(f);
}
function exportSvgString(onlySel){
  const shapes = onlySel && sel.size ? cloneShapes([...sel]).map(s => byId(s.id)).filter(Boolean) : board.shapes;
  const b = union(shapes.map(s => { const hb = hitBounds(s); if (s.type === 'connector'){ const lb = connLabelBox(s, connGeom(s)); return union([hb, lb]); } return hb; }));
  if (!b) return null;
  const pad = 32, W = Math.ceil(b.w + pad * 2), H = Math.ceil(b.h + pad * 2);
  const saved = editing; editing = null;
  exportingImages = true; const body = renderShapesSvg(shapes); exportingImages = false; editing = saved;
  return {W, H, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${r2(b.x - pad)} ${r2(b.y - pad)} ${W} ${H}" font-family='${FONT}'>` +
    `<defs>${shapes.some(sh => famOf(sh) === FONT_HAND) ? `<style>${fontFaceCss()}</style>` : ''}<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".18"/></filter></defs>` +
    `<rect x="${r2(b.x - pad)}" y="${r2(b.y - pad)}" width="${W}" height="${H}" fill="${BG()}"/>${body}</svg>`};
}
function exportSVG(){ const r = exportSvgString(true); if (!r) return toast('Nothing to export'); download(exportBase() + '.svg', new Blob([r.svg], {type: 'image/svg+xml'})); }
function exportPNG(){
  const r = exportSvgString(true); if (!r) return toast('Nothing to export');
  const img = new Image(), scale = 2;
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = r.W * scale; c.height = r.H * scale;
    const ctx = c.getContext('2d'); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
    c.toBlob(b => download(exportBase() + '.png', b), 'image/png');
  };
  img.onerror = () => toast('PNG export failed — try SVG');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.svg);
}
$('#imageInput').addEventListener('change', e => { insertImages(e.target.files); e.target.value = ''; });
$('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; });

/* ---------- sample topology ---------- */
function sampleTopology(ox = 0, oy = 0){
  const S = [];
  const dev = (kind, x, y, text, info, role) => { const s = makeShape('device', ox + x, oy + y, {kind}); Object.assign(s, {w: 64, h: 64, text, info, role}); S.push(s); return s; };
  const cloud = (label, color, x, y) => { const s = makeShape('cloud', ox + x, oy + y, {text: label, color}); Object.assign(s, {w: 190, h: 110, fill: 'semi', dash: 'solid', size: 'm'}); S.push(s); return s; };
  const zone = (text, x, y, w, h, color) => { const s = makeShape('zone', ox + x, oy + y); Object.assign(s, {w, h, text, color}); S.push(s); return s; };
  const link = (a, b, preset, text = '', sp = '', ep = '', extra = {}) => {
    const l = LINKS[preset]; const s = makeShape('connector', 0, 0, {start: {id: a.id}, end: {id: b.id}, arrows: 'none'});
    Object.assign(s, {color: l.color, dash: l.dash, size: l.size, text, startLabel: sp, endLabel: ep, route: 'straight', fontSize: 'm'}, extra); S.push(s); return s;
  };
  zone('Data Centre — Core', 150, 350, 560, 240, 'blue');
  zone('Campus', 60, 640, 740, 390, 'green');
  const inet = cloud('Internet', 'blue', 120, 0), mpls = cloud('MPLS WAN', 'violet', 560, 0);
  const fw = dev('firewall', 210, 210, 'FW-EDGE-01', 'Security team', 'ML');
  const rtr = dev('router', 625, 210, 'MAN-RTR-01', 'ASR 920 · 10.0.0.1', 'ML');
  const c1 = dev('l3switch', 260, 440, 'CORE-01', 'N9K-C93180YC · 10.0.1.1', 'CL');
  const c2 = dev('l3switch', 540, 440, 'CORE-02', 'N9K-C93180YC · 10.0.1.2', 'CL');
  const d1 = dev('l3switch', 260, 700, 'DIST-01', 'C9500-24Y4C · 10.0.2.1', 'DL');
  const d2 = dev('l3switch', 540, 700, 'DIST-02', 'C9500-24Y4C · 10.0.2.2', 'DL');
  const a1 = dev('switch', 130, 910, 'ACC-01', 'C9300L-48P', 'AS');
  const a2 = dev('switch', 400, 910, 'ACC-02', 'C9300L-48P', 'AS');
  const a3 = dev('switch', 670, 910, 'ACC-03', 'C9300L-48P', 'AS');
  link(inet, fw, 'wan', 'ISP 1G', '', 'eth1');
  link(mpls, rtr, 'wan', 'CCT-10023 · 1G', '', 'Gi0/0/0');
  link(fw, c1, 'fiber', '', 'eth2', 'Eth1/1');
  link(fw, c2, 'fiber', '', 'eth3', 'Eth1/1');
  link(rtr, c1, 'smf', '', 'Te0/0/2', 'Eth1/2');
  link(rtr, c2, 'smf', '', 'Te0/0/3', 'Eth1/2');
  link(c1, c2, 'pc', 'vPC peer-link · Po1');
  link(c1, d1, 'smf', '', 'Eth1/10', 'Te1/0/1'); link(c2, d2, 'smf', '', 'Eth1/10', 'Te1/0/1');
  link(c1, d2, 'smf', '', '', '', {bend: 0}); link(c2, d1, 'smf');
  link(d1, d2, 'pc', 'Po10', '', '');
  for (const a of [a1, a2, a3]){ link(d1, a, 'trunk'); link(d2, a, 'trunk'); }
  return S;
}
function insertSample(boot = false){
  const c = toWorld(innerWidth / 2, innerHeight / 2);
  const shapes = sampleTopology(0, 0);
  const b = union(shapes.filter(s => s.type !== 'connector').map(hitBounds));
  const dx = board.shapes.length ? c.x - (b.x + b.w / 2) : 0, dy = board.shapes.length ? c.y - (b.y + b.h / 2) : 0;
  for (const s of shapes){ if (s.type !== 'connector'){ s.x += dx; s.y += dy; } }
  board.shapes.unshift(...shapes.filter(s => s.type === 'zone'));
  board.shapes.push(...shapes.filter(s => s.type !== 'zone'));
  sel = new Set(shapes.map(s => s.id)); commit(); zoomFit(shapes, !board.shapes.length || boot); sel.clear(); render();
}

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (e.key === ' '){ if (!spaceDown){ spaceDown = true; svgEl.style.cursor = 'grab'; } e.preventDefault(); return; }
  if (mod){
    if (k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (k === 'y'){ e.preventDefault(); redo(); }
    else if (k === 'd'){ e.preventDefault(); if (sel.size){ sel = new Set(duplicate([...sel])); commit(); render(); } }
    else if (k === 'c'){ copySel(false); }
    else if (k === 'x'){ copySel(true); }
    else if (k === 'a'){ e.preventDefault(); sel = new Set(board.shapes.filter(s => !s.locked).map(s => s.id)); render(); }
    else if (k === 'l' && e.shiftKey){ e.preventDefault(); toggleLock(); }
    else if (k === 's'){ e.preventDefault(); saveFile(); }
    else if (k === 'o'){ e.preventDefault(); $('#fileInput').click(); }
    else if (k === 'e' && e.shiftKey){ e.preventDefault(); exportPNG(); }
    else if (k === '0'){ e.preventDefault(); zoomTo(1); }
    else if (k === '=' || k === '+'){ e.preventDefault(); zoomTo(cam.z * 1.25); }
    else if (k === '-'){ e.preventDefault(); zoomTo(cam.z / 1.25); }
    return;
  }
  if (e.altKey && k === 't'){ e.preventDefault(); toggleTheme(); return; }
  if (e.key === 'Escape' && tool === 'laser'){               // like tldraw: first clear the live trail, then leave the tool
    const s = lasers.find(x => x.state === 'active');
    if (s){ lasers = lasers.filter(x => x !== s); laserDraw = null; drawLaser(); } else setTool('select');
    return;
  }
  if (e.key === 'Escape'){ $('#help').classList.remove('open'); closeMenu(); closePages(); closeBoards(); if (tool !== 'select') setTool('select'); else { sel.clear(); render(); } return; }
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Enter' && sel.size === 1){ e.preventDefault(); const s = byId([...sel][0]); if (s && s.type !== 'draw') startEdit(s); return; }
  if (e.key.startsWith('Arrow') && sel.size){ e.preventDefault(); const d = e.shiftKey ? 10 : 1; nudge(e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0, e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0); return; }
  if (e.key === '?'){ $('#help').classList.toggle('open'); return; }
  if (e.key === 'PageDown'){ e.preventDefault(); if (curPage < pages.length - 1) switchPage(curPage + 1); return; }
  if (e.key === 'PageUp'){ e.preventDefault(); if (curPage > 0) switchPage(curPage - 1); return; }
  if (k === 'q' && !e.shiftKey){ toolLock = !toolLock; toast('Tool lock ' + (toolLock ? 'on' : 'off')); updateToolbar(); return; }
  if (e.key === ']'){ reorder('front'); return; } if (e.key === '['){ reorder('back'); return; }
  if (e.shiftKey && (e.code === 'Digit1')){ zoomFit(); return; }
  if (e.shiftKey && (e.code === 'Digit0')){ zoomTo(1); return; }
  if (e.shiftKey && k === 'l'){ $('#libBtn').click(); return; }
  if (k === '=' || k === '+'){ zoomTo(cam.z * 1.25); return; } if (k === '-'){ zoomTo(cam.z / 1.25); return; }
  if (e.shiftKey) return;
  const map = {v: 'select', h: 'hand', p: 'draw', k: 'laser', e: 'eraser', l: 'link', a: 'arrow', t: 'text', n: 'note', r: 'rect', o: 'ellipse', d: 'diamond', c: 'cloud', f: 'zone'};
  const dmap = {'1': 'router', '2': 'l3switch', '3': 'switch', '4': 'firewall', '5': 'server'};
  if (k === 'i'){ $('#imageInput').click(); return; }
  if (map[k]) setTool(map[k]); else if (dmap[k]) setTool('device', dmap[k]);
});

document.addEventListener('paste', e => {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  const txt = e.clipboardData && e.clipboardData.getData('text/plain');
  if (txt){
    try { const d = JSON.parse(txt); if (d && d.app === 'idea-board' && Array.isArray(d.shapes)){ e.preventDefault(); paste(d.shapes, d.assets); return; } } catch (_) {}
  }
  const imgs = e.clipboardData ? [...e.clipboardData.files].filter(f => /^image\//.test(f.type)) : [];
  if (imgs.length){ e.preventDefault(); insertImages(imgs); return; }        // screenshot / copied picture
  if (txt){
    e.preventDefault();
    const p = lastMouse ? toWorld(lastMouse.x, lastMouse.y) : toWorld(innerWidth / 2, innerHeight / 2);
    const s = addShape(makeShape('text', p.x, p.y, {text: txt.slice(0, 5000)})); layoutText(s); sel = new Set([s.id]); commit(); render(); return;
  }
  if (clip){ e.preventDefault(); paste(); }
});

   Opened as a plain file (or from a plain web server) the app keeps boards in the browser as before.

const USER_KEY = 'ideaboard:user:v1', SRV_LAST = 'ideaboard:srv:last', SRV_CAM = id => 'ideaboard:srv:cam:' + id;
const USER_COLORS = ['#e03131', '#1f6feb', '#2b8a3e', '#e8590c', '#7048e8', '#0c8599', '#c2255c', '#5c940d', '#f08c00', '#1c7ed6'];
const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
function loadUser(){ try { const u = JSON.parse(lsGet(USER_KEY) || 'null'); if (u && u.name && u.id) return u; } catch (e) {} return null; }
function saveUser(u){ try { localStorage.setItem(USER_KEY, JSON.stringify(u)); } catch (e) {} }
async function detectServer(){
  if (!/^https?:$/.test(location.protocol)) return false;
  try { const r = await fetch('api/health', {cache: 'no-store'}); const j = await r.json(); return !!(j && j.app === 'idea-board'); } catch (e) { return false; }
}
async function apiCall(method, path, body){
  const url = 'api/' + path + (path.includes('?') ? '&' : '?') + 'user=' + encodeURIComponent(me ? me.name : '');
  const r = await fetch(url, {method, cache: 'no-store', headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function askName(){
  return new Promise(resolve => {
    const w = document.createElement('div'); w.id = 'who';
    w.innerHTML = `<div class="card"><h2>${me ? 'Change your name' : 'Welcome to Idea Board'}</h2><p>Type your name so your team can see who is drawing. Your private boards are kept under this name, and it is remembered on this computer.</p>` +
      `<input class="field" maxlength="40" placeholder="Your name, e.g. Syed" value="${esc(me ? me.name : '')}"><button>Continue</button></div>`;
    document.body.appendChild(w);
    const inp = w.querySelector('input'); setTimeout(() => { inp.focus(); inp.select(); }, 0);
    const done = () => {
      const n = inp.value.trim().slice(0, 40); if (!n){ inp.focus(); return; }
      const u = me ? {...me} : {id: uid() + uid(), color: USER_COLORS[Math.floor(Math.random() * USER_COLORS.length)]};
      u.name = n; me = u; saveUser(u); w.remove(); resolve(u);
    };
    w.querySelector('button').onclick = done;
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') done(); });
  });
}
function setNet(state){ const d = $('#netdot'); if (d){ d.className = 'netdot ' + state; d.title = {live: 'Live — changes are shared instantly', connecting: 'Connecting to the server…', offline: 'Offline — reconnecting. Your changes are kept and sent when the connection is back.'}[state] || ''; } }
function drawPeople(){
  const P = $('#people'); if (!SERVER){ P.classList.remove('on'); return; }
  P.classList.add('on');
  const others = remoteUsers.slice(0, 6), more = remoteUsers.length - others.length;

    others.map(u => `<span class="av" style="background:${esc(u.color)}" title="${esc(u.name)}${u.page ? ' — on ' + esc(pageName(u.page)) : ''}">${esc(initials(u.name))}</span>`).join('') +
    (more > 0 ? `<span class="av" style="background:#868e96" title="${more} more">+${more}</span>` : '');
  setNet(LIVE ? 'live' : ws && ws.readyState === 0 ? 'connecting' : 'offline');

}
document.addEventListener('click', async e => {

function loadCams(id){ try { return JSON.parse(lsGet(SRV_CAM(id)) || '{}') || {}; } catch (e) { return {}; } }

/* ----- websocket ----- */
function wsUrl(){ const u = new URL('ws', location.href); u.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; return u.href; }
function wsSend(o){ if (ws && ws.readyState === 1) try { ws.send(JSON.stringify(o)); } catch (e) {} }
function connect(id){
  clearTimeout(wsTimer);
  if (ws){ ws.onclose = null; ws.onmessage = null; try { ws.close(); } catch (e) {} }
  pendingBoard = id; LIVE = false; setNet('connecting');
  const sock = ws = new WebSocket(wsUrl());
  sock.onopen = () => { wsBackoff = 1000; sock.send(JSON.stringify({t: 'hello', board: id, user: me, page: pages[curPage] && boardId === id ? pages[curPage].id : null})); };
  sock.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } onNet(m); };
  sock.onclose = () => {
    if (ws !== sock) return;
    LIVE = false; remoteUsers = []; remoteCursors = {}; drawPeople(); drawPresence(); setNet('offline');
    wsTimer = setTimeout(() => connect(pendingBoard), wsBackoff); wsBackoff = Math.min(wsBackoff * 2, 15000);
  };
}
function onNet(m){
  switch (m.t){
    case 'init': applyInit(m.board); break;
    case 'batch': applyBatch(m); break;
    case 'pages': applyPages(m.pages); break;
    case 'meta': board.name = m.name; if (document.activeElement !== $('#boardName')) $('#boardName').value = m.name; updateTitle(); break;
    case 'asset': assets[m.id] = m.data; sentAssets.add(m.id); for (const c of gCache.values()) c.str = null; render(); break;
    case 'presence': remoteUsers = (m.users || []).filter(u => !me || u.id !== me.id);
      for (const id in remoteCursors) if (!remoteUsers.some(u => u.id === id)) delete remoteCursors[id];
      drawPeople(); drawPresence(); break;
    case 'cursor': remoteCursors[m.from] = {x: m.x, y: m.y, page: m.page, name: m.name, color: m.color, t: Date.now()}; drawPresence(); break;
    case 'laser': remoteLaserMsg(m); break;
    case 'deleted':
      if (ws){ ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; }
      LIVE = false; toast(m.reason || 'This board is no longer available'); srvFallback(); break;
  }
}
const docPages = (doc, cams) => doc.pages.map(p => ({id: p.id, name: normPageName(p.name), shapes: Array.isArray(p.shapes) ? p.shapes : [], cam: cams[p.id] || null}));
function collectPending(){
  syncPage();
  return pages.map(p => {
    const base = netMaps[p.id];
    if (!base) return {page: p.id, put: JSON.parse(JSON.stringify(p.shapes)), del: []};
    const d = diffShapes(p.shapes, base.map, base.order);
    return {page: p.id, put: d.changes.filter(c => c.after).map(c => JSON.parse(c.after)), del: d.changes.filter(c => !c.after).map(c => c.id)};
  }).filter(x => x.put.length || x.del.length);
}
function applyInit(b){
  const doc = b.doc, first = hadInitFor !== b.id;
  const pending = first ? [] : collectPending();
  srvMeta = b;
  assets = Object.assign({}, doc.assets || {}); sentAssets = new Set(Object.keys(assets));
  const cams = first ? loadCams(b.id) : Object.fromEntries(pages.map(p => [p.id, p.cam]));
  const want = first ? cams._page : pages[curPage] && pages[curPage].id;
  const pg = docPages(doc, cams), idx = Math.max(0, pg.findIndex(p => p.id === want));
  if (first){ enterBoard(b.id, doc.name || b.name, pg, idx); }
  else { board.name = doc.name || b.name; $('#boardName').value = board.name; updateTitle(); pages = pg; curPage = -1; switchPage(idx, true); }
  netMaps = {}; for (const p of pages) netMaps[p.id] = {map: shapeMap(p.shapes), order: p.shapes.map(sh => sh.id)};
  hadInitFor = b.id; LIVE = true; wsSend({t: 'page', page: pages[curPage].id});
  if (pending.length){                                  // re-apply what you drew while the connection was down
    for (const pd of pending){ const i = pages.findIndex(p => p.id === pd.page); if (i >= 0) applyToPage(i, pd.put, pd.del, null, false); }
    resetHistBase(); for (let i = 0; i < pages.length; i++) netSync(i);
    toast('Reconnected — your changes were sent');
  }
  try { localStorage.setItem(SRV_LAST, b.id); } catch (e) {}
  const {doc: _d, ...bm} = b; const ent = srvBoards.find(x => x.id === b.id); if (ent) Object.assign(ent, bm); else srvBoards.unshift(bm);
  drawPeople(); updatePageUI(); render();
}
function applyToPage(pi, put, del, order, fromRemote){
  const isCur = pi === curPage;
  let list = isCur ? board.shapes : (pages[pi].shapes || []);
  for (const sh of put || []){ const i = list.findIndex(x => x.id === sh.id); if (i >= 0) list[i] = sh; else list.push(sh); if (sh.type === 'text' && isCur) layoutText(sh); }
  if (del && del.length){ const ds = new Set(del); list = list.filter(x => !ds.has(x.id)); for (const id of del) sel.delete(id); }
  if (order){ const pos = new Map(order.map((id, i) => [id, i])); list.sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : 1e9) - (pos.has(b.id) ? pos.get(b.id) : 1e9)); }
  if (isCur){ board.shapes = list; syncPage(); } else pages[pi].shapes = list;
  if (fromRemote){
    const nb = netMaps[pages[pi].id] || (netMaps[pages[pi].id] = {map: new Map(), order: []});
    for (const sh of put || []) nb.map.set(sh.id, JSON.stringify(sh));
    for (const id of del || []) nb.map.delete(id);
    nb.order = list.map(x => x.id);
    if (isCur){                                          // others' changes are not part of your undo history
      for (const sh of put || []) histMap.set(sh.id, JSON.stringify(sh));
      for (const id of del || []) histMap.delete(id);
      histOrder = list.map(x => x.id);
    }
  }
}
function applyBatch(m){
  let pi = pages.findIndex(p => p.id === m.page);
  if (pi < 0){ pages.push({id: m.page, name: '', shapes: [], cam: null}); pi = pages.length - 1; updatePageUI(); }
  applyToPage(pi, m.put, m.del, m.order, true);
  if (pi === curPage){ if ([...(m.put || []), ...(m.del || []).map(id => ({id}))].some(x => sel.has(x.id))) panelKey = ''; render(); }
}
function applyPages(list){
  syncPage();
  const cur = pages[curPage] && pages[curPage].id, old = new Map(pages.map(p => [p.id, p]));
  pages = list.map(p => { const o = old.get(p.id); if (o){ o.name = normPageName(p.name); return o; } return {id: p.id, name: normPageName(p.name), shapes: [], cam: null}; });
  for (const p of pages) if (!netMaps[p.id]) netMaps[p.id] = {map: new Map(), order: []};
  const idx = pages.findIndex(p => p.id === cur);
  if (idx < 0){ curPage = -1; switchPage(0, true); toast('The page you were on was deleted by a teammate'); }
  else { curPage = idx; updatePageUI(); }
  if ($('#pagesPanel').classList.contains('open')) buildPagesPanel();
  drawPeople();
}
function netSync(pi = curPage){
  if (!LIVE) return;
  lastNet = performance.now();
  const pg = pages[pi]; if (!pg) return;
  const list = pi === curPage ? board.shapes : (pg.shapes || []);
  const base = netMaps[pg.id] || (netMaps[pg.id] = {map: new Map(), order: []});
  const d = diffShapes(list, base.map, base.order);
  base.map = d.cur; base.order = d.order;
  for (const sh of list) if (sh.type === 'image' && assets[sh.asset] && !sentAssets.has(sh.asset)){ sentAssets.add(sh.asset); wsSend({t: 'asset', id: sh.asset, data: assets[sh.asset]}); }
  const put = [], del = [];
  for (const c of d.changes) c.after ? put.push(JSON.parse(c.after)) : del.push(c.id);
  if (put.length || del.length || d.orderAfter) wsSend({t: 'batch', page: pg.id, put, del, order: d.orderAfter || undefined});
}
function netPages(){ if (!LIVE) return; syncPage(); wsSend({t: 'pages', pages: pages.map(p => ({id: p.id, name: p.name}))}); for (let i = 0; i < pages.length; i++) netSync(i); }
function netMeta(){ if (!LIVE) return; clearTimeout(metaTimer); metaTimer = setTimeout(() => { wsSend({t: 'meta', name: board.name}); const e = srvBoards.find(b => b.id === boardId); if (e) e.name = board.name; }, 400); }
function netCursor(e){
  if (!LIVE) return; const now = performance.now(); if (now - lastCursor < 50) return; lastCursor = now;
  const p = toWorld(e.clientX, e.clientY); wsSend({t: 'cursor', x: r2(p.x), y: r2(p.y), page: pages[curPage] && pages[curPage].id});
}
function netLaser(a, p){ if (LIVE) wsSend({t: 'laser', a, x: p ? r2(p.x) : 0, y: p ? r2(p.y) : 0, page: pages[curPage] && pages[curPage].id}); }
const laserHeldRemote = s => Object.values(remoteLaser).some(r => r.s === s);
function remoteLaserMsg(m){
  if (!pages[curPage] || m.page !== pages[curPage].id) return;
  const now = performance.now(), r = remoteLaser[m.from];
  if (m.a === 'start'){
    let s = lasers.find(x => x.state === 'active' && x.uid === m.from);
    if (!s){ s = {items: [], state: 'active', lastActive: now, fadeElapsed: 0, total: 0, uid: m.from}; lasers.push(s); }
    const item = {pts: [{x: m.x, y: m.y}], done: false}; s.items.push(item); s.lastActive = now;
    remoteLaser[m.from] = {s, item}; laserLoop();
  } else if (m.a === 'move' && r){ r.item.pts.push({x: m.x, y: m.y}); r.s.lastActive = now; }
  else if (m.a === 'end' && r){ r.item.done = true; r.s.lastActive = now; delete remoteLaser[m.from]; }
}
function drawPresence(){
  const g = $('#presence'); if (!g) return;
  if (!SERVER){ g.innerHTML = ''; return; }
  g.setAttribute('transform', `translate(${r2(cam.x)} ${r2(cam.y)}) scale(${cam.z})`);
  const pid = pages[curPage] && pages[curPage].id, now = Date.now(), k = 1 / cam.z;
  let out = '';
  for (const [id, c] of Object.entries(remoteCursors)){
    if (c.page !== pid || now - c.t > 60000) continue;
    const w = measureUi(c.name) + 12;
    out += `<g transform="translate(${c.x} ${c.y}) scale(${r2(k)})"><path d="M0 0 L0 17 L4.5 13 L7.5 20 L10.5 18.8 L7.6 12 L13 12 Z" fill="${esc(c.color)}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>` +
      `<rect x="12" y="16" width="${r2(w)}" height="19" rx="5" fill="${esc(c.color)}"/><text x="18" y="26" font-size="11.5" font-weight="600" fill="#fff" dominant-baseline="central" font-family='${FONT_SYS}'>${esc(c.name)}</text></g>`;
  }
  g.innerHTML = out;
}
const uiCtx = document.createElement('canvas').getContext('2d');
function measureUi(t){ uiCtx.font = `600 11.5px ${FONT_SYS}`; return uiCtx.measureText(String(t)).width; }

/* ----- board list & board actions on the server ----- */
async function srvRefreshList(){ try { srvBoards = await apiCall('GET', 'boards'); } catch (e) { toast('Server: ' + e.message); } }
function srvOpen(id){
  if (id === boardId && LIVE) return;
  if (boardId) saveNow();
  hadInitFor = null; toast('Opening board…'); connect(id);
}
async function srvNew(shared, name, doc){
  try {
    const base = name || (shared ? 'Team board' : 'My board');
    const names = new Set(srvBoards.map(b => (b.name || '').toLowerCase()));
    let nm = base, n = 2; while (!name && names.has(nm.toLowerCase())) nm = `${base} ${n++}`;
    const m = await apiCall('POST', 'boards', {name: nm, shared: !!shared, owner: me.name, doc});
    srvBoards.unshift(m); closeBoards(); srvOpen(m.id);
    if (!doc) setTimeout(() => { const inp = $('#boardName'); inp.focus(); inp.select(); }, 500);
    toast(doc ? `Imported as private board "${m.name}"` : shared ? 'New team board — everyone on the team can open it' : 'New private board — only listed for you');
  } catch (e) { toast('Could not create the board: ' + e.message); }
}
async function srvDuplicate(id){ try { const m = await apiCall('POST', `boards/${id}/duplicate`, {}); srvBoards.unshift(m); buildBoardsPanel(); toast(`Copied to your private boards as "${m.name}"`); } catch (e) { toast(e.message); } }
async function srvRename(id, name){
  name = String(name || '').trim().slice(0, 80) || 'Untitled board';
  if (id === boardId){ board.name = name; $('#boardName').value = name; updateTitle(); wsSend({t: 'meta', name}); }
  else try { await apiCall('PATCH', `boards/${id}`, {name}); } catch (e) { toast(e.message); }
  const e = srvBoards.find(b => b.id === id); if (e) e.name = name; buildBoardsPanel();
}
async function srvShare(id, shared){
  try { const m = await apiCall('PATCH', `boards/${id}`, {shared}); const i = srvBoards.findIndex(b => b.id === id); if (i >= 0) srvBoards[i] = {...srvBoards[i], ...m}; buildBoardsPanel(); toast(shared ? 'Now a team board — everyone can open and edit it' : 'Now private — only listed for you'); }
  catch (e) { toast(e.message); }
}
async function srvDelete(id){
  const e = srvBoards.find(b => b.id === id); if (!e) return;
  if (!confirm(`Delete the ${e.shared ? 'team' : 'private'} board "${e.name}" for everyone?\n\nThe server keeps a backup copy in its data folder.`)) return;
  try { await apiCall('DELETE', `boards/${id}`); } catch (err){ toast(err.message); return; }
  srvBoards = srvBoards.filter(b => b.id !== id); buildBoardsPanel(); toast('Board deleted');
  if (id === boardId) srvFallback();
}
async function srvFallback(){
  await srvRefreshList();
  const next = srvBoards.find(b => b.id !== boardId);
  if (next) srvOpen(next.id); else srvNew(false);
}
function buildBoardsPanelSrv(){
  const P = $('#boardsPanel'); if (P.querySelector('.pp-input')) return;
  const mine = n => me && n && n.toLowerCase() === me.name.toLowerCase();
  const row = b => `<div class="pp-item bp-item ${b.id === boardId ? 'active' : ''}" data-id="${b.id}"><div class="bp-text"><span class="pp-name" title="Double-click to rename">${esc(b.name || 'Untitled board')}</span>` +
    `<div class="bp-meta">${b.shared ? esc(mine(b.owner) ? 'you' : b.owner) + ' · ' : ''}${b.pages || 1} page${(b.pages || 1) > 1 ? 's' : ''} · ${ago(b.updated)}${b.updatedBy && !mine(b.updatedBy) ? ' by ' + esc(b.updatedBy) : ''}${b.online ? ` · <b style="color:#2b8a3e">${b.online} online</b>` : ''}</div></div><span class="pp-acts">` +
    `<button data-bd="rename" title="Rename">${BI('<path d="M4 20h4L19 9l-4-4L4 16z"/>')}</button>` +
    `<button data-bd="dup" title="Copy to my private boards">${BI('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>')}</button>` +
    (mine(b.owner) ? `<button data-bd="share" title="${b.shared ? 'Make private' : 'Share with the team'}">${BI(b.shared ? '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>' : '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c.6-.2 1.3-.3 2-.3 2.5 0 4 1.8 4 4.8"/>')}</button>` +
      `<button data-bd="del" class="danger" title="Delete board">${BI('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>')}</button>` : '') + `</span></div>`;
  const team = srvBoards.filter(b => b.shared), priv = srvBoards.filter(b => !b.shared);
  P.innerHTML = `<div class="pp-head"><span>Boards on the team server</span></div>` +
    `<div class="bp-new"><button data-bd="newteam">+ Team board</button><button data-bd="newpriv">+ Private board</button></div>` +
    `<div class="bp-sec">Team boards (${team.length})</div>` + (team.map(row).join('') || `<div class="bp-meta" style="padding:4px 10px">No team boards yet.</div>`) +
    `<div class="bp-sec">My private boards (${priv.length})</div>` + (priv.map(row).join('') || `<div class="bp-meta" style="padding:4px 10px">No private boards yet.</div>`) +
    `<div class="bp-foot">Team boards can be opened and edited live by everyone on this server. Private boards are listed only under your name (${esc(me ? me.name : '')}). Use Menu → Save to file for an offline copy.</div>`;
}
function srvBoardsClick(act, row, id, e){
  if (act === 'newteam') return srvNew(true);
  if (act === 'newpriv') return srvNew(false);
  if (act === 'rename') return renameBoardInline(id);
  if (act === 'dup') return srvDuplicate(id);
  if (act === 'del') return srvDelete(id);
  if (act === 'share'){ const b = srvBoards.find(x => x.id === id); return b && srvShare(id, !b.shared); }
  if (row && !e.target.closest('input')){ srvOpen(id); closeBoards(); }
}
async function srvBoot(){
  me = loadUser() || await askName();
  drawPeople();
  await srvRefreshList();
  let last = lsGet(SRV_LAST);
  if (!srvBoards.some(b => b.id === last)) last = (srvBoards.find(b => b.shared) || srvBoards[0] || {}).id;
  if (last) srvOpen(last);
  else {                                                     // very first user: a team board with the sample network
    const tmp = {shapes: []}; const save = board.shapes; board.shapes = tmp.shapes;
    const S = sampleTopology(0, 0); board.shapes = save;
    const zones = S.filter(x => x.type === 'zone'), rest = S.filter(x => x.type !== 'zone');
    srvNew(true, 'Sample network', {name: 'Sample network', pages: [{id: uid(), name: '', shapes: [...zones, ...rest]}], assets: {}});
  }
}

/* ---------- boot ---------- */
const hadBoard = load();
if (/^https?:$/.test(location.protocol)) svgEl.style.visibility = 'hidden';     // wait until we know whether a team server is present
if (!style.font) style.font = defaultFont();
if (document.fonts && document.fonts.load){
  Promise.all([document.fonts.load('16px IdeaDraw'), document.fonts.load('700 16px IdeaDraw')]).then(() => applyFontPref()).catch(() => {});
}
if (hadBoard) assets = usedAssets();
if (!pages.length){ pages = [{id: uid(), name: '', shapes: board.shapes, cam: null}]; curPage = 0; }
updatePageUI();
$('#boardName').value = board.name;
$('#library').classList.toggle('open', prefs.library && innerWidth > 700);
if (!(prefs.library && innerWidth > 700)) prefs.library = false;
board.shapes.forEach(s => { if (s.type === 'text') layoutText(s); });
resetHistBase();
applyTheme();
(async () => {
  SERVER = await detectServer();
  svgEl.style.visibility = '';
  if (SERVER){ board.shapes = []; pages = [{id: uid(), name: '', shapes: board.shapes, cam: null}]; curPage = 0; render(); await srvBoot(); return; }
  if (!hadBoard){ boardId = uid(); board.name = 'Sample network'; $('#boardName').value = board.name; insertSample(true); undoStack = []; resetHistBase(); saveNow(); }
  else render();
  updateTitle();
})();
window.ideaBoard = {get server(){ return SERVER; }, get live(){ return LIVE; }, get me(){ return me; }, get srvBoards(){ return srvBoards; }, srvOpen, srvNew, get assets(){ return assets; }, insertImages, board, get cam(){ return cam; }, get boards(){ return boardsIndex; }, get boardId(){ return boardId; }, get lasers(){ return lasers; }, openBoard, newBoard, get pages(){ syncPage(); return pages; }, get curPage(){ return curPage; }, switchPage, addPage, zoomFit, exportSvgString};
</script>
