# OPTIONAL: put Idea Board behind an existing nginx (for HTTPS or a nicer URL).
# The /ws location must pass the WebSocket upgrade headers, or live editing won't work.
server {
    listen 443 ssl;
    server_name ideaboard.example.internal;          # change

    ssl_certificate     /etc/nginx/certs/ideaboard.crt;   # change
    ssl_certificate_key /etc/nginx/certs/ideaboard.key;   # change

    client_max_body_size 40m;                         # boards with pictures

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;       # WebSocket (live editing)
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
